services:
  - type: web
    name: campusswap-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.same-origin
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_FRONTEND
        value: "true"
      - key: CAMPUSSWAP_DEMO_MODE
        value: "true"
      - key: EMAIL_PROVIDER
        value: disabled
      - key: OTP_MOCK_ENABLED
        value: "false"
      - key: CAMPUS_ISSUE_PRIVATE_EVIDENCE_ENABLED
        value: "false"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: TRUST_PROXY_HOPS
        sync: false
