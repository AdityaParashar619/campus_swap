# Development-only Compose stack. Use docker-compose.production.yml for production settings.
services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 5000
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-200}
      MONGO_URI: mongodb://mongodb:27017/campusswap
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      FRONTEND_URL: http://localhost:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-CampusSwap Admin}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-false}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      ALLOWED_COLLEGE_DOMAINS: ${ALLOWED_COLLEGE_DOMAINS:-}
      INSTITUTION_EMAIL_PATTERN: ${INSTITUTION_EMAIL_PATTERN:-}
      ENROLLMENT_PATTERN: ${ENROLLMENT_PATTERN:-}
      INSTITUTION_DEPARTMENTS: ${INSTITUTION_DEPARTMENTS:-}
      INSTITUTION_BRANCHES: ${INSTITUTION_BRANCHES:-}
      INSTITUTION_CLUBS: ${INSTITUTION_CLUBS:-}
      INSTITUTION_SEMESTERS: ${INSTITUTION_SEMESTERS:-1,2,3,4,5,6,7,8}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-gmail}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      OTP_MOCK_ENABLED: ${OTP_MOCK_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_TEST_MODE: ${RESEND_TEST_MODE:-false}
      RESEND_TEST_RECIPIENT: ${RESEND_TEST_RECIPIENT:-delivered@resend.dev}
      RESEND_DOMAIN_VERIFIED: ${RESEND_DOMAIN_VERIFIED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-5}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
      OTP_PEPPER: ${OTP_PEPPER:?Set OTP_PEPPER in the root .env file}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      PRODUCT_IMAGE_MAX_COUNT: ${PRODUCT_IMAGE_MAX_COUNT:-5}
      PRODUCT_IMAGE_MAX_SIZE_MB: ${PRODUCT_IMAGE_MAX_SIZE_MB:-5}
      PILOT_MODE_ENABLED: ${PILOT_MODE_ENABLED:-false}
      PILOT_ALLOWED_EMAILS: ${PILOT_ALLOWED_EMAILS:-}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:
