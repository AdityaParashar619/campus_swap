services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/campusswap
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      FRONTEND_URL: http://localhost:8080
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-CampusSwap Admin}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      ALLOWED_COLLEGE_DOMAINS: ${ALLOWED_COLLEGE_DOMAINS:-}
      ENROLLMENT_PATTERN: ${ENROLLMENT_PATTERN:-}
      INSTITUTION_DEPARTMENTS: ${INSTITUTION_DEPARTMENTS:-}
      INSTITUTION_BRANCHES: ${INSTITUTION_BRANCHES:-}
      INSTITUTION_CLUBS: ${INSTITUTION_CLUBS:-}
      INSTITUTION_SEMESTERS: ${INSTITUTION_SEMESTERS:-1,2,3,4,5,6,7,8}
      OTP_MOCK_ENABLED: ${OTP_MOCK_ENABLED:-true}
      EMAIL_PROVIDER_URL: ${EMAIL_PROVIDER_URL:-}
      EMAIL_PROVIDER_API_KEY: ${EMAIL_PROVIDER_API_KEY:-}
      OTP_PEPPER: ${OTP_PEPPER:-local-compose-otp-pepper-change-this-123456789}
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongodb_data:
